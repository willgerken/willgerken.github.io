<style>
:root { --bg: #eef3f6; --card: #fff; --ink: #13212c; --muted: #5a6977; --line: #d6dee5; --blue: #1d4f9e; --red: #c41f2e; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg: #0c131a; --card: #141e27; --ink: #e6edf3; --muted: #93a2b0; --line: #24323d; --blue: #7aa2f2; --red: #ff6470; color-scheme: dark } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.4 "Segoe UI", system-ui, sans-serif; padding-inline: 16px }
form { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--blue); padding: 22px; width: min(340px, 100%); display: grid; gap: 12px }
h1 { margin: 0; font: 700 24px/1 "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .03em } h1 span { color: var(--red) }
input[type=password] { font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink) }
button { font: 600 15px inherit; padding: 10px; border: 0; border-radius: 4px; background: var(--blue); color: #fff; cursor: pointer }
label.r { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center }
#err { color: var(--red); font-size: 14px; min-height: 1em; margin: 0 }
</style></head><body>

const u8 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEYNAME = 'spartans.key.' + B.s;
async function open_(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(B.i) }, key, u8(B.c));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(B.s), iterations: B.n }, base, 256));
}
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEYNAME); } catch (e) {}
  if (saved) { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    await open_(u8(saved)); return; } catch (e) { try { localStorage.removeItem(KEYNAME); } catch (e2) {} } }
})();
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault(); const err = document.getElementById('err'); err.textContent = 'Opening…';
  try {
    const raw = await derive(document.getElementById('pw').value);
    if (document.getElementById('rem').checked) { try {
      for (const k of Object.keys(localStorage)) if (k.startsWith('spartans.key.')) localStorage.removeItem(k);
      localStorage.setItem(KEYNAME, btoa(String.fromCharCode(...raw)));
      // ask the browser not to clear this site's storage (2026-11-10: Will kept getting the password screen)
      if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {} }
    await open_(raw);
  } catch (e) { err.textContent = 'That password did not work.'; }
});
