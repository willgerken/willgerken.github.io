<style>
:root { --bg: #eef3f6; --card: #fff; --ink: #13212c; --muted: #5a6977; --line: #d6dee5; --blue: #1d4f9e; --red: #c41f2e; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg: #0c131a; --card: #141e27; --ink: #e6edf3; --muted: #93a2b0; --line: #24323d; --blue: #7aa2f2; --red: #ff6470; color-scheme: dark } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.4 "Segoe UI", system-ui, sans-serif; padding-inline: 16px }
form { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--blue); padding: 22px; width: min(340px, 100%); display: grid; gap: 12px }
h1 { margin: 0; font: 700 24px/1 "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .03em } h1 span { color: var(--red) }
input[type=password] { font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink) }
button { font: 600 15px inherit; padding: 10px; border: 0; border-radius: 4px; background: var(--blue); color: #fff; cursor: pointer }
label.r { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center }
#err { color: var(--red); font-size: 14px; min-height: 1em; margin: 0 }
</style></head><body>
