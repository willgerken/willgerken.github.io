<style>
:root { --bg: #f4f3ef; --card: #fff; --ink: #1d2422; --muted: #5d6762; --line: #d9dcd6; --accent: #16706a; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg: #141917; --card: #1e2421; --ink: #e7eae6; --muted: #a3aca7; --line: #333a36; --accent: #6cc3b9; color-scheme: dark } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.4 "Segoe UI", system-ui, sans-serif; padding-inline: 16px }
form { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--accent); padding: 22px; width: min(340px, 100%); display: grid; gap: 12px; box-sizing: border-box }
h1 { margin: 0; font: 600 22px/1.15 Georgia, serif }
input[type=password] { font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink) }
button { font: 600 15px/1 inherit; padding: 11px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer }
label.r { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center }
#err { color: #b5562f; font-size: 14px; min-height: 1em; margin: 0 }
a { color: var(--muted); font-size: 14px }
</style></head><body>

const u8 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const PREFIX = 'cedar.paint.key.';
const KEYNAME = PREFIX + B.s;
async function decrypt_(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(B.i) }, key, u8(B.c));
  const kb = btoa(String.fromCharCode(...raw));
  return new TextDecoder().decode(pt).replace('<!--CK-->', '<script>window.__ck="' + kb + '"<\/script>');
}
async function show(html) {
  // document.open() during parsing appends instead of replacing; wait until the shell has finished loading
  if (document.readyState === 'loading') await new Promise(r => document.addEventListener('DOMContentLoaded', r, { once: true }));
  await new Promise(r => setTimeout(r, 0));
  document.open(); document.write(html); document.close();
}
async function open_(raw) { await show(await decrypt_(raw)); }
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(B.s), iterations: B.n }, base, 256));
}
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEYNAME); } catch (e) {}
  if (saved) { try { await open_(u8(saved)); return; } catch (e) { try { localStorage.removeItem(KEYNAME); } catch (e2) {} } }
})();
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault(); const err = document.getElementById('err'); err.textContent = 'Opening...';
  try {
    const raw = await derive(document.getElementById('pw').value);
    const html = await decrypt_(raw);   // throws on a wrong password, before anything is saved
    if (document.getElementById('rem').checked) { try {

    show(html);
  } catch (e) { err.textContent = 'That password did not work.'; }
});
